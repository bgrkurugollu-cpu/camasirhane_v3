name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest

    # Testler gerçek PostgreSQL'e karşı koşar (implementation gate raporundaki
    # "SQLite ile test" bulgusunun karşılığı). SQLite yalnızca lokal hızlı çalışma
    # için fallback'tir; CI'da PG zorunludur.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: camasirhane
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: camasirhane_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U camasirhane -d camasirhane_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # app/database.py import sırasında DATABASE_URL şart; conftest test motorunu
      # TEST_DATABASE_URL'den kurar. İkisi de aynı CI veritabanını gösterir.
      DATABASE_URL: postgresql://camasirhane:testpass@localhost:5432/camasirhane_test
      TEST_DATABASE_URL: postgresql://camasirhane:testpass@localhost:5432/camasirhane_test
      PRIVATE_KEY_PATH: certs/private_key.pem
      PUBLIC_KEY_PATH: certs/public_key.pem

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate RS256 test keys
        # certs/ .gitignore'da olduğundan (gerçek anahtar repoya girmez) CI'da
        # geçici bir RS256 çifti üretilir; yalnızca test çalıştırması içindir.
        run: |
          mkdir -p certs
          openssl genpkey -algorithm RSA -out certs/private_key.pem -pkeyopt rsa_keygen_bits:2048
          openssl rsa -in certs/private_key.pem -pubout -out certs/public_key.pem

      - name: Run tests
        # pytest.ini: --cov-fail-under=80 → coverage eşiği CI'da da zorlanır.
        run: pytest

  security-audit:
    name: Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit dependencies
        # high/critical güvenlik açığı → pipeline fail (bkz. 08_SECURITY_IMPLEMENTATION.md §13).
        run: pip-audit -r requirements.txt
